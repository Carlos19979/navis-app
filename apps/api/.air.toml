root = "."
tmp_dir = "tmp"

[build]
  # The .exe suffix is required by air on Windows and harmless on macOS/Linux.
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  bin = "./tmp/main.exe"
  include_ext = ["go", "toml"]
  exclude_dir = ["tmp", "vendor"]
  delay = 1000

[log]
  time = false

[misc]
  clean_on_exit = true
