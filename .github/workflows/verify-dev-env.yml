# TEMPORARY — verifies PR #111 on macOS and real Docker. Removed before merge.
name: Verify dev env (temp)

on:
  push:
    branches: [fix/dev-env-windows-podman]

jobs:
  macos:
    name: macOS — lockfile, iOS, Android, air
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: pub get leaves pubspec.lock untouched
        working-directory: apps/mobile
        run: |
          flutter pub get
          git diff --exit-code pubspec.lock

      - name: Codegen
        working-directory: apps/mobile
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        working-directory: apps/mobile
        run: flutter build ios --debug --no-codesign

      - name: Build Android APK
        working-directory: apps/mobile
        run: flutter build apk --debug

      - name: air builds and runs tmp/main.exe
        working-directory: apps/api
        run: |
          go install github.com/air-verse/air@latest
          ( "$(go env GOPATH)/bin/air" > air.log 2>&1 & echo $! > air.pid )
          for i in $(seq 1 60); do
            grep -q '"msg":"failed to connect to database"\|"msg":"starting server"' air.log && break
            sleep 2
          done
          kill "$(cat air.pid)" || true
          cat air.log
          test -f tmp/main.exe || ls tmp
          grep -q 'database\|starting server' air.log

  docker:
    name: Linux + Docker — make dev with a real JWT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: make dev
        run: make dev

      - name: API reachable and accepts a Supabase JWT
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8080/readyz && break; sleep 3; done
          curl -fsS localhost:8080/readyz
          ANON=$(cd packages/supabase && supabase status -o json | jq -r .ANON_KEY)
          TOKEN=$(curl -fsS -X POST localhost:54321/auth/v1/signup \
            -H "apikey: $ANON" -H 'Content-Type: application/json' \
            -d '{"email":"ci-check@example.com","password":"Passw0rd!123"}' \
            | jq -r '.access_token // .session.access_token')
          curl -fsS localhost:8080/api/v1/boats -H "Authorization: Bearer $TOKEN" | tee /dev/stderr | jq -e '.data'

      - name: API logs
        if: always()
        run: docker compose logs api --tail 50
